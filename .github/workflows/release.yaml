name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME}"
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify release versions
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib

          version = os.environ["VERSION"]
          with open("custom_components/pentair_easytouch/manifest.json", "rb") as file:
              manifest_version = json.load(file)["version"]
          with open("pyproject.toml", "rb") as file:
              package_version = tomllib.load(file)["project"]["version"]

          if manifest_version != version or package_version != version:
              raise SystemExit(
                  "Release tag and committed versions must match: "
                  f"tag={version}, manifest={manifest_version}, package={package_version}"
              )
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create zip
        run: |
          cd custom_components/pentair_easytouch
          zip -r ../../pentair_easytouch.zip .

      - name: Create GitHub release with asset
        uses: softprops/action-gh-release@v2
        with:
          files: pentair_easytouch.zip
          generate_release_notes: true
