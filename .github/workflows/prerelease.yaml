name: Prerelease

on:
  push:
    branches: [develop]

concurrency:
  group: develop-prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    name: Publish develop prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate prerelease version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          tags = subprocess.check_output(
              ["git", "tag", "--list"], text=True
          ).splitlines()
          versions = [
              tuple(map(int, match.groups()))
              for tag in tags
              if (match := re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", tag))
          ]
          major, minor, patch = max(versions, default=(0, 0, 0))
          version = f"{major}.{minor}.{patch + 1}-dev.{os.environ['GITHUB_RUN_NUMBER']}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

      - name: Set prerelease versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          manifest_path = Path("custom_components/pentair_easytouch/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = version
          manifest_path.write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          package_path = Path("pyproject.toml")
          package = package_path.read_text(encoding="utf-8")
          package, replacements = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              package,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not update project version in pyproject.toml")
          package_path.write_text(package, encoding="utf-8")
          PY

      - name: Create prerelease zip
        run: |
          cd custom_components/pentair_easytouch
          zip -r ../../pentair_easytouch.zip .

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.version }}
          files: pentair_easytouch.zip
          generate_release_notes: true
          prerelease: true
